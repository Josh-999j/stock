<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1080" role="img" aria-labelledby="title desc">
  <title id="title">新專案從開始到回報控制中心流程圖</title>
  <desc id="desc">Josh 建立新專案後，依序讀規則、確認正式名稱、建立專案檔案、寫報到紀錄、回報總機，再開始工作並由控制中心自動彙整。</desc>
  <defs>
    <style>
      .card { fill: var(--card,#ffffff); stroke: var(--line,#d0d7de); stroke-width: 1.5; }
      .branch { fill: var(--card,#ffffff); stroke: var(--WAITING,#2f81f7); stroke-width: 1.5; }
      .step { fill: var(--WAITING,#2f81f7); stroke: var(--card,#ffffff); stroke-width: 2; }
      .stepText { fill: #ffffff; font: 700 12px "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .text { fill: var(--text,#1f2328); font: 14px "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; text-anchor: middle; }
      .small { fill: var(--text,#1f2328); font: 13px "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; text-anchor: middle; }
      .strong { font-weight: 700; }
      .arrow { fill: none; stroke: var(--WAITING,#2f81f7); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowhead); }
      .warning { fill: var(--card,#ffffff); stroke: #d1242f; stroke-width: 2; }
      .warningLabel { fill: #d1242f; font: 700 14px "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; text-anchor: middle; }
      .warningText { fill: var(--text,#1f2328); font: 13px "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; text-anchor: middle; }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--WAITING,#2f81f7)"/>
    </marker>
  </defs>

  <!-- 0：建立新對話 -->
  <rect class="card" x="24" y="20" width="312" height="68" rx="14"/>
  <circle class="step" cx="45" cy="54" r="15"/>
  <text class="stepText" x="45" y="54">0</text>
  <text class="small" x="196" y="48">
    <tspan class="strong" x="196">Josh 按「➕ 開新專案」→ 複製開場句</tspan>
    <tspan x="196" dy="20">→ 貼到新對話第一句</tspan>
  </text>
  <path class="arrow" d="M180 88 V108"/>

  <!-- 1：讀規則 -->
  <rect class="card" x="24" y="110" width="312" height="58" rx="14"/>
  <circle class="step" cx="45" cy="139" r="15"/>
  <text class="stepText" x="45" y="139">1</text>
  <text class="text strong" x="194" y="144">讀全域共用規則＋名稱對照表</text>
  <path class="arrow" d="M180 168 V188"/>

  <!-- 2：正式名稱 -->
  <rect class="card" x="24" y="190" width="312" height="64" rx="14"/>
  <circle class="step" cx="45" cy="222" r="15"/>
  <text class="stepText" x="45" y="222">2</text>
  <text class="text" x="194" y="216">
    <tspan class="strong" x="194">使用正式名稱</tspan>
    <tspan x="194" dy="20">對照表沒有 → 等總機登記</tspan>
  </text>
  <path class="arrow" d="M180 254 V274"/>

  <!-- 3：資料夾 -->
  <rect class="card" x="24" y="276" width="312" height="64" rx="14"/>
  <circle class="step" cx="45" cy="308" r="15"/>
  <text class="stepText" x="45" y="308">3</text>
  <text class="text" x="194" y="302">
    <tspan class="strong" x="194">資料夾放對位置</tspan>
    <tspan x="194" dy="20">不確定先問 Josh</tspan>
  </text>
  <path class="arrow" d="M180 340 V360"/>

  <!-- 4：project.json -->
  <rect class="card" x="24" y="362" width="312" height="64" rx="14"/>
  <circle class="step" cx="45" cy="394" r="15"/>
  <text class="stepText" x="45" y="394">4</text>
  <text class="text" x="194" y="388">
    <tspan class="strong" x="194">建立 project.json</tspan>
    <tspan x="194" dy="20">記錄負責大C／小C、共用資源</tspan>
  </text>
  <path class="arrow" d="M180 426 V446"/>

  <!-- 5：規則檔 -->
  <rect class="card" x="24" y="448" width="312" height="64" rx="14"/>
  <circle class="step" cx="45" cy="480" r="15"/>
  <text class="stepText" x="45" y="480">5</text>
  <text class="text" x="194" y="474">
    <tspan class="strong" x="194">建立規則檔 CLAUDE.md</tspan>
    <tspan x="194" dy="20">有小C → 再加 AGENTS.md</tspan>
  </text>
  <path class="arrow" d="M180 512 V532"/>

  <!-- 6：worklog 報到 -->
  <rect class="card" x="24" y="534" width="312" height="58" rx="14"/>
  <circle class="step" cx="45" cy="563" r="15"/>
  <text class="stepText" x="45" y="563">6</text>
  <text class="text strong" x="194" y="568">worklog.md 寫第一筆「報到」</text>
  <path class="arrow" d="M180 592 V612"/>

  <!-- 7：回報總機與分支 -->
  <rect class="card" x="24" y="614" width="312" height="50" rx="14"/>
  <circle class="step" cx="45" cy="639" r="15"/>
  <text class="stepText" x="45" y="639">7</text>
  <text class="text strong" x="194" y="644">報到總機</text>
  <path class="arrow" d="M180 664 V678 H91 V692"/>
  <path class="arrow" d="M180 678 H269 V692"/>
  <rect class="branch" x="24" y="694" width="134" height="58" rx="12"/>
  <text class="small" x="91" y="716">
    <tspan class="strong" x="91">大C</tspan>
    <tspan x="91" dy="19">直接傳訊</tspan>
  </text>
  <rect class="branch" x="202" y="694" width="134" height="58" rx="12"/>
  <text class="small" x="269" y="716">
    <tspan class="strong" x="269">小C</tspan>
    <tspan x="269" dy="19">_inbox 放報到單</tspan>
  </text>
  <path class="arrow" d="M91 752 V768 H180 V780"/>
  <path class="arrow" d="M269 752 V768 H180"/>

  <!-- 需事先同意的事項 -->
  <rect class="warning" x="36" y="790" width="288" height="76" rx="12"/>
  <rect x="86" y="780" width="188" height="22" rx="11" fill="var(--card,#ffffff)" stroke="#d1242f" stroke-width="2"/>
  <text class="warningLabel" x="180" y="796">要先報總機＋Josh 同意</text>
  <text class="warningText" x="180" y="824">
    <tspan x="180">建排程／Codex 定時任務／登記傳聲筒</tspan>
    <tspan x="180" dy="21">用別人的金鑰、.venv 或 XQ 畫面</tspan>
  </text>
  <path class="arrow" d="M180 866 V886"/>

  <!-- 8：對話正式命名 -->
  <rect class="card" x="24" y="888" width="312" height="58" rx="14"/>
  <circle class="step" cx="45" cy="917" r="15"/>
  <text class="stepText" x="45" y="917">8</text>
  <text class="text strong" x="194" y="922">Josh 把對話改成正式名稱</text>
  <path class="arrow" d="M180 946 V966"/>

  <!-- 9：開始工作與自動彙整 -->
  <rect class="card" x="24" y="968" width="312" height="88" rx="14"/>
  <circle class="step" cx="45" cy="1012" r="15"/>
  <text class="stepText" x="45" y="1012">9</text>
  <text class="small" x="194" y="994">
    <tspan class="strong" x="194">開始工作 → 每段工作寫 worklog</tspan>
    <tspan x="194" dy="20">Codex 定時任務跑完也要寫</tspan>
  </text>
  <text class="small strong" x="194" y="1041">控制中心每分鐘自動收 → 卡片／動態</text>
</svg>
