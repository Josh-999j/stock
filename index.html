<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem("hx_theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紅蝦ㄟㄞ法</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#F7F9FA; --ink:#0F171E; --ink-2:#44586A;
  --muted:#71889B; --line:#D9E1E8; --line-2:#E9EEF2;
  --accent:#1F4A6D; --accent-soft:#E4EDF4;
  --up:#C42B22; --up-soft:#FBE9E7; --down:#0E8A47; --down-soft:#E4F4EB;
  --warn:#9A6210; --warn-soft:#FBF0DC;
  --s26:#5B4B8A; --s28:#1F6E7B; --s33:#8A4B5B; --s34:#4B6E2A; --s35:#7A5A18;
  --shadow:0 1px 2px rgba(15,23,30,.05),0 6px 18px -10px rgba(15,23,30,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0C1217; --surface:#151E26; --surface-2:#1B252E; --ink:#E9EFF4; --ink-2:#A9BDCD;
  --muted:#7D93A5; --line:#28343E; --line-2:#202B34;
  --accent:#7FB2D8; --accent-soft:#1A2A38;
  --up:#F2665C; --up-soft:#2E1917; --down:#3FBE79; --down-soft:#122A1E;
  --warn:#D9A44E; --warn-soft:#2A2114;
  --s26:#A695D8; --s28:#5FB9C6; --s33:#D291A1; --s34:#9DC470; --s35:#C8A552;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px -12px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C1217; --surface:#151E26; --surface-2:#1B252E; --ink:#E9EFF4; --ink-2:#A9BDCD;
  --muted:#7D93A5; --line:#28343E; --line-2:#202B34;
  --accent:#7FB2D8; --accent-soft:#1A2A38;
  --up:#F2665C; --up-soft:#2E1917; --down:#3FBE79; --down-soft:#122A1E;
  --warn:#D9A44E; --warn-soft:#2A2114;
  --s26:#A695D8; --s28:#5FB9C6; --s33:#D291A1; --s34:#9DC470; --s35:#C8A552;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:28px 56px}
.num{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}

/* header */
header{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
h1{font-family:"Noto Serif TC",serif;font-weight:700;font-size:clamp(25px,4.2vw,34px);line-height:1.18;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:6px}
.meta{display:flex;gap:18px;flex-wrap:wrap}
.meta div{text-align:right}
.meta .k{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.meta .v{font-size:19px;font-weight:600;margin-top:1px}

/* date nav (XQ style) */
.dnav{position:relative;display:flex;align-items:center;gap:6px;margin-bottom:22px;flex-wrap:wrap}
#view-daily .dnav{position:sticky;top:0;z-index:30;background:var(--bg);padding:8px 0;margin-bottom:14px;box-shadow:0 6px 8px -8px rgba(0,0,0,.5)}   /* v6.40：日期列凍結在畫面最上面 */
.dnav button{
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  height:34px;min-width:34px;padding:0 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:14px;
  display:inline-flex;align-items:center;justify-content:center;
  transition:background .12s,border-color .12s,color .12s;
}
.dnav button:hover:not(:disabled):not([aria-pressed="true"]){border-color:var(--accent);color:var(--ink)}
.dnav button:disabled{opacity:.35;cursor:default}
.dnav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dnav .arr{padding:0;width:34px;font-size:18px;line-height:1}
.dnav .latest[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
:root[data-theme="dark"] .dnav .latest[aria-pressed="true"]{color:#0C1217}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dnav .latest[aria-pressed="true"]{color:#0C1217}}
.dnav .cal-btn{padding:0;width:34px}
.dnav .cal-btn svg{width:17px;height:17px}
.calwrap{position:static}
.cal{position:absolute;top:42px;left:0;max-width:calc(100vw - 32px);box-sizing:border-box;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:12px;width:272px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.cal[hidden]{display:none}
.cal .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:600;font-size:14px}
.cal .ch button{height:28px;min-width:28px;padding:0}
.cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal .wk{font-size:11px;color:var(--muted);padding:3px 0}
.cal .dd{height:32px;min-width:0;padding:0;border-radius:7px;font-size:13px;font-variant-numeric:tabular-nums}
.cal .dd:disabled{opacity:1;color:var(--muted);border-color:transparent;background:transparent}
.cal .dd.has{font-weight:600;color:var(--ink)}
.cal .dd[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .cal .dd[aria-current="true"]{color:#0C1217}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cal .dd[aria-current="true"]{color:#0C1217}}
.cal .note{margin-top:8px;font-size:11px;color:var(--muted)}
/* P&L summary */
.pnl{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;margin:0 0 18px;padding:12px 14px;border:1px solid var(--line);
  border-radius:12px;background:var(--surface);font-size:13px;color:var(--ink-2)}
.pnl:empty{display:none}
.pnl .big{font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:600}
.pnl .up{color:var(--up)} .pnl .dn{color:var(--down)}
.pnl .k{color:var(--muted);font-size:12px}
.topn{display:flex;align-items:center;gap:4px;flex-wrap:wrap;flex-basis:100%;margin-bottom:2px}
.topn .k{margin-right:4px}
.topn button{border:1px solid var(--line);background:transparent;color:var(--ink-2);height:28px;min-width:28px;padding:0 6px;
  border-radius:7px;cursor:pointer;font:inherit;font-size:13px;font-variant-numeric:tabular-nums}
.topn button:hover:not([aria-pressed="true"]){border-color:var(--accent);color:var(--ink)}
.topn button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
:root[data-theme="dark"] .topn button[aria-pressed="true"]{color:#0C1217}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .topn button[aria-pressed="true"]{color:#0C1217}}
#tb-rank tr.outn{opacity:.45}
#rank-tbl{min-width:0}
#rank-tbl thead th{padding:11px 9px}
#rank-tbl tbody td{padding:13px 9px}
#rank-tbl tr.mr td{border-bottom:none;padding-bottom:6px}
#rank-tbl tr.sub td{padding-top:0;padding-bottom:13px}
#rank-tbl tr.sub:hover,#rank-tbl tr.mr:hover{background:transparent}
#rank-tbl .nm,#rank-tbl .cd{white-space:nowrap}
#rank-tbl .p{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:14px}
#rank-tbl .p.up{color:var(--up)} #rank-tbl .p.dn{color:var(--down)}
#rank-tbl .c-hold{display:block;margin-top:7px}
#rank-tbl .ln{display:flex;justify-content:flex-end;gap:8px;white-space:nowrap;line-height:1.75}
#rank-tbl .ln .lb{font-size:11px;color:var(--muted)}
#rank-tbl .cr .p.big{font-size:14px;color:var(--ink)}
#rank-tbl .subw{display:flex;gap:10px 28px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
#rank-tbl .subw .k{font-size:11px;color:var(--muted);margin-right:6px;letter-spacing:.05em}
#rank-tbl .subw .c-cond .cond{display:none;max-width:none}
.unlocked #rank-tbl .subw .c-cond .cond.real{display:inline}
@media (max-width:1100px) and (min-width:761px){#rank-tbl .cd{white-space:normal} #rank-tbl .nm{white-space:normal}}
#rank-tbl th.c-cr,#rank-tbl th.c-rng,#rank-tbl th.c-mx{color:var(--accent)}
#rank-cf{margin:0 0 10px}
.msort{display:none}
@media (max-width:760px){
  .msort{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:14px;color:var(--muted)}
  .msort select{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;height:38px;padding:0 10px;flex:1;min-width:0}
  .msort button{font:inherit;font-size:14px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:8px;height:38px;padding:0 12px;white-space:nowrap;cursor:pointer}
}
#rank-h .sk{cursor:pointer;user-select:none;white-space:nowrap}
#rank-h .sk:hover{color:var(--ink)}
#rank-h .sk .ar{display:inline-block;width:10px;margin-left:2px;color:var(--accent)}
#rank-h .sk[aria-sort="none"] .ar{color:transparent}
#rank-h .sk[aria-sort="none"]:hover .ar{color:var(--muted)}
.pnl .sm{font-size:12px;color:var(--muted);flex-basis:100%}
.trk .pc{font-size:15px;font-weight:600}
.trk .lb{color:var(--muted)}
.dnav .dtxt{margin-left:8px;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

/* sections */
section{margin-bottom:34px}
.shead{display:flex;align-items:baseline;gap:11px;margin-bottom:12px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.shead h2{font-family:"Noto Serif TC",serif;font-size:18px;font-weight:700;margin:0;letter-spacing:.01em}
.shead .count{font-size:12px;color:var(--muted)}
.shead .why{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}

/* table */
.tbox{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:900px}
thead th{
  font-size:11px;letter-spacing:.07em;color:var(--muted);font-weight:600;text-transform:uppercase;
  text-align:left;padding:11px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap;
}
thead th.r{text-align:right}
tbody td{padding:13px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
td.r{text-align:right}
.rk{font-family:"IBM Plex Mono",monospace;font-size:21px;font-weight:600;color:var(--accent);line-height:1.1}
.nm{font-weight:600;white-space:nowrap}
.cd{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted)}
.ind{font-size:12px;color:var(--muted);margin-top:2px}
.px{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600}
.chg{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;display:inline-block;margin-top:2px;padding:1px 6px;border-radius:4px}
.chg.up{color:var(--up);background:var(--up-soft)}
.chg.dn{color:var(--down);background:var(--down-soft)}
.trk{font-family:"IBM Plex Mono",monospace;font-size:11px;margin-top:3px;color:var(--muted)}
.trk.up{color:var(--up)}
.trk.dn{color:var(--down)}
.trk.n{color:var(--ink)}
.lv{font-family:"IBM Plex Mono",monospace;font-size:14px;white-space:nowrap}
.lv.buy{color:var(--accent);font-weight:600}
.lv.stop{color:var(--down)}
.lv.tp{color:var(--up)}
.dash{color:var(--muted)}
.rr{font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:600}
.rr span{font-size:10px;color:var(--muted);font-weight:400}
.th{font-size:13px;line-height:1.5;max-width:270px}
.cond{font-size:13px;line-height:1.5;max-width:190px;color:var(--ink-2)}
.rreason{font-size:12px;line-height:1.5;color:var(--muted);margin-top:4px}

/* strategy chips */
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;
  padding:2px 7px;border-radius:5px;border:1px solid currentColor;line-height:1.45;
}
.c29{color:var(--ink-2)}.c26{color:var(--s26)}.c28{color:var(--s28)}.c33{color:var(--s33)}.c34{color:var(--s34)}.c35{color:var(--s35)}

/* list cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:11px}
.card{
  border:1px solid var(--line);border-radius:11px;background:var(--surface);padding:13px 14px;
  border-left:3px solid var(--edge,var(--line));box-shadow:var(--shadow);
}
.card.w{--edge:var(--warn)}
.card.a{--edge:var(--down)}
.card .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:3px}
.card .top .nm{font-size:15px}
.card .top .px{margin-left:auto}
.card .sub2{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:1px}
.card .sub2 div{display:inline}
.card .rsn{font-size:13px;color:var(--ink-2);margin-top:7px;line-height:1.55}
.card .chips{margin-top:7px}

/* strategy count strip */
.counts{display:flex;flex-wrap:wrap;gap:7px;margin:-6px 0 20px}
.cnt{
  display:flex;align-items:baseline;gap:5px;border:1px solid var(--line);border-radius:8px;
  background:var(--surface);padding:5px 10px;font-size:12px;box-shadow:var(--shadow);
}
.cnt .s{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:11px}
.cnt .n{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:14px;color:var(--ink)}
.cnt .n.zero{color:var(--muted);font-weight:400}
.cnt .lbl{color:var(--muted)}

/* other picks tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:9px}
.tile{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:11px 12px;box-shadow:var(--shadow)}
.tile .t1{display:flex;align-items:baseline;gap:8px}
.tile .t1 .nm{font-size:15px}
.tile .t1 .px{margin-left:auto;font-size:15px}
.tile .t2{display:flex;align-items:center;gap:8px;margin-top:2px}
.tile .t2 .cd{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .chips{margin-top:8px}
.empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:14px}
footer{margin-top:42px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.7}
footer b{color:var(--ink-2);font-weight:600}

.hl{display:inline-block;font-size:12px;line-height:1;padding:5px 9px;border-radius:999px;
  border:1px solid var(--line);white-space:nowrap;font-weight:600}
.hl-long{color:#1f7a4d;background:rgba(31,122,77,.10);border-color:rgba(31,122,77,.28)}
.hl-mid{color:#8a6410;background:rgba(138,100,16,.10);border-color:rgba(138,100,16,.28)}
.hl-short{color:#a33a2c;background:rgba(163,58,44,.10);border-color:rgba(163,58,44,.28)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hl-long{color:#6cd39b;background:rgba(108,211,155,.12);border-color:rgba(108,211,155,.3)}
  :root:not([data-theme="light"]) .hl-mid{color:#e3bb63;background:rgba(227,187,99,.12);border-color:rgba(227,187,99,.3)}
  :root:not([data-theme="light"]) .hl-short{color:#f08b7b;background:rgba(240,139,123,.12);border-color:rgba(240,139,123,.3)}}
:root[data-theme="dark"] .hl-long{color:#6cd39b;background:rgba(108,211,155,.12);border-color:rgba(108,211,155,.3)}
:root[data-theme="dark"] .hl-mid{color:#e3bb63;background:rgba(227,187,99,.12);border-color:rgba(227,187,99,.3)}
:root[data-theme="dark"] .hl-short{color:#f08b7b;background:rgba(240,139,123,.12);border-color:rgba(240,139,123,.3)}
@media (max-width:760px){
  body{font-size:17px}
  table{min-width:0}
  thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .tbox{overflow-x:visible}
  tbody tr{
    display:grid;grid-template-columns:repeat(12,minmax(0,1fr));
    column-gap:10px;row-gap:0;padding:20px 16px 22px;
    border-bottom:1px solid var(--line);
  }
  tbody tr:last-child{border-bottom:none}
  tbody tr:hover{background:transparent}
  tbody td{display:block;padding:0;border:none;text-align:left}

  #tb-rank tr.mr td.c-rk{grid-column:1 / 3;grid-row:1}
  #tb-rank tr.mr td.c-nm{grid-column:3 / 9;grid-row:1}
  #tb-rank tr.mr td.c-px{grid-column:9 / 13;grid-row:1;text-align:right}
  #tb-rank tr.mr td.c-st{grid-column:1 / 13;grid-row:2;margin-top:12px}
  #tb-rank tr.mr td.c-buy{grid-column:1 / 4;grid-row:3}
  #tb-rank tr.mr td.c-stop{grid-column:4 / 7;grid-row:3}
  #tb-rank tr.mr td.c-tp{grid-column:7 / 10;grid-row:3}
  #tb-rank tr.mr td.c-rr{grid-column:10 / 13;grid-row:3}
  #tb-rank tr.mr td.c-amt{grid-column:1 / 5;grid-row:4}
  #tb-rank tr.mr td.c-cr{grid-column:5 / 9;grid-row:4}
  #tb-rank tr.mr td.c-mx{grid-column:9 / 13;grid-row:4}
  #tb-rank tr.mr td.c-rng{grid-column:1 / 13;grid-row:5}
  #tb-rank tr.mr :is(td.c-buy,td.c-stop,td.c-tp,td.c-rr,td.c-amt,td.c-cr,td.c-mx,td.c-rng){
    margin-top:14px;padding-top:12px;border-top:1px solid var(--line);text-align:center}
  #tb-rank tr.mr :is(td.c-amt,td.c-cr,td.c-mx){border-top-style:dashed}
  #tb-rank tr.mr td.c-rng{border-top:none;margin-top:6px;padding-top:4px}
  #tb-rank tr.mr td::before{text-align:center}
  #tb-rank tr.mr{border-bottom:none!important;padding-bottom:6px!important}
  #tb-rank tr.sub{display:block!important;padding:0 16px 22px!important;border-bottom:1px solid var(--line)}
  #tb-rank tr.sub td{display:block;padding:0!important}
  #rank-tbl .subw{flex-direction:column;gap:12px;font-size:15px}
  #rank-tbl .subw .k{display:block;font-size:12px;margin-bottom:3px}
  #rank-tbl .ln{justify-content:center}
  #rank-tbl .rng{display:flex;justify-content:space-around}
  #rank-tbl .rng .ln{flex-direction:column;gap:0;line-height:1.4;align-items:center}
  #rank-tbl .rng .ln .lb{font-size:12px}
  #rank-tbl .p{font-size:16px}
  #rank-tbl .c-hold{display:inline-block;margin:0 0 0 8px;vertical-align:middle}
  #rank-tbl .c-st .chips{display:inline-flex;vertical-align:middle}
  #rank-tbl .cd{white-space:normal}
  .shead h2{white-space:nowrap}
  td[data-l]::before{
    content:attr(data-l);display:block;font-size:12px;letter-spacing:.06em;
    color:var(--muted);margin-bottom:4px;font-weight:500;
  }
  td.name-cell::before,td.px-cell::before,td.st-cell::before,td.c-rk::before,td.c-rng::before{content:none}

  .rk{font-size:23px;line-height:1.35}
  .nm{font-size:20px;line-height:1.35}
  .cd{font-size:14.5px;margin-top:3px;white-space:normal}
  .px{font-size:20px;line-height:1.35}
  td.px-cell .chg{margin-top:5px;font-size:14.5px;padding:2px 8px}
  td.px-cell .trk{margin-top:3px;font-size:13.5px}
  .lv{font-size:18px}
  .rr{font-size:18px}
  .rr span{font-size:13px}
  .th,.cond{max-width:none;font-size:15.5px;line-height:1.6}
  .hl{font-size:13.5px;padding:6px 11px}

  .shead h2{font-size:20px}
  .shead .count{font-size:14px}

<script>
const S = {26:'c26',28:'c28',29:'c29',33:'c33',34:'c34',35:'c35'};
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n2 = v => (v==null||v==='') ? null : Number(v);
const fmt = v => { const x=n2(v); if(x==null||!isFinite(x)) return null;
  return x>=1000 ? x.toLocaleString('en-US',{maximumFractionDigits:0})
       : x.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); };
const chips = arr => '<div class="chips">' + (arr||[]).map(s =>
  `<span class="chip ${S[s]||''}">${esc(s)}</span>`).join('') + '</div>';
const chg = v => { const x=n2(v); if(x==null) return '';
  return `<div><span class="chg ${x>=0?'up':'dn'}">${x>=0?'+':''}${x.toFixed(2)}%</span></div>`; };
const trk = r => { if(r.ret==null) return '';
  const neg = String(r.ret).trim().startsWith('-');
  const lbl = r.d!=null ? `損益${r.d}D` : '現損益';
  const cls = r.d===0 ? 'n' : (neg?'dn':'up');
  if(r.d===0) return `<div class="trk n"><span class="lb">今日入選</span></div>`;
  const md = String(r.asof||'').slice(5).replace('-','/');
  return `<div class="trk ${cls}"><span class="lb">${md} 收 ${fmt(r.cur)}・${r.d}天</span><br><span class="pc">${neg?'':'+'}${r.ret}</span></div>`; };
const lv = (v,cls) => { const f=fmt(v); return f?`<span class="lv ${cls}">${f}</span>`:'<span class="dash">—</span>'; };

const HOLD={'26':[60,'1–3 個月'],'34':[20,'2–4 週'],'35':[20,'2–4 週'],'28':[8,'5–10 日'],'33':[4,'3–5 日'],'29':[4,'3–5 日']};
const hold = (list, ov) => {
  if(ov && HOLD[String(ov)]) return `<span class="hl ${HOLD[String(ov)][0]>=60?'hl-long':(HOLD[String(ov)][0]>=20?'hl-mid':'hl-short')}">${HOLD[String(ov)][1]}</span>`;
  const ks=(list||[]).map(String).filter(k=>HOLD[k]);
  if(!ks.length) return '<span class="dash">—</span>';
  ks.sort((a,b)=>HOLD[a][0]-HOLD[b][0]);
  const d0=HOLD[ks[0]][0];
  const cls = d0>=60?'hl-long':(d0>=20?'hl-mid':'hl-short');
  return `<span class="hl ${cls}">${HOLD[ks[0]][1]}</span>`;
};

let DAYS = [], cur = null;

function renderDay(d){
  if(!d){ $('tb-rank').innerHTML = '<tr><td colspan="12" class="empty">這一天沒有資料</td></tr>';
    $('cd-watch').innerHTML = $('cd-avoid').innerHTML = ''; return; }
  $('m-date').textContent = d.date || '—';
  $('m-idx').textContent  = d.taiex ? fmt(d.taiex) : '—';
  try{ mkDay(d); }catch(e){}

  const rank = d.rank || [];
  $('c-rank').textContent = (rank.length ? `${rank.length} 檔` : '') + (d.backfill ? '・回補（規則排序）' : '');
  renderRankHead(rank);
  const ln = (lb, v, cls) => `<div class="ln ${cls}"><span class="lb">${lb}</span>${v}</div>`;
  $('tb-rank').innerHTML = rank.length ? sortRank(d, rank).map(([r,i]) => {
    const s = sec(d,r), today = r.d===0;
    const ret = r.ret==null||r.ret==='' ? null : parseFloat(r.ret);
    return `
    <tr class="mr" data-i="${i}">
      <td class="rank-cell c-rk"><span class="rk">${i+1}</span></td>
      <td class="name-cell c-nm"><div class="nm">${esc(r.name)}</div><div class="cd">${esc(r.code)}${r.industry?" · "+esc(r.industry):""}</div></td>
      <td class="st-cell c-st"><span class="c-st2">${chips(r.strategies)}</span><span class="c-hold">${hold(r.strategies, r.hold)}</span></td>
      <td class="r px-cell c-px"><span class="px">${fmt(r.close)||'—'}</span>${chg(r.chg)}${today?'<div class="trk n"><span class="lb">今日入選</span></div>':''}</td>
      <td class="r c-amt" data-l="成交量/額">${va(r)}</td>
      <td class="r lv-cell c-buy" data-l="買點">${lv(r.buy,'buy')}</td>
      <td class="r lv-cell c-stop" data-l="停損">${lv(r.stop,'stop')}</td>
      <td class="r lv-cell c-tp" data-l="停利">${lv(r.target,'tp')}</td>
      <td class="r rr-cell c-rr" data-l="風報比"><span class="mask">***</span>${s.rr!=null?`<span class="rr real">${Number(s.rr).toFixed(1)}<span> :1</span></span>`:'<span class="dash real">—</span>'}</td>
      <td class="r c-cr cr" data-l="入選至今">${today?'<span class="dash">—</span>':`<div class="ln c-cur">${nv(r.cur)}</div><div class="ln c-ret">${pc(ret)}</div>`}</td>
      <td class="r c-rng rng">${ln('5日',pc(r.r5),'c-r5')}${ln('10日',pc(r.r10),'c-r10')}${ln('20日',pc(r.r20),'c-r20')}</td>
      <td class="r c-mx" data-l="期間最高">${pc(r.mx)}</td>
    </tr>
    <tr class="sub" data-i="${i}"><td></td><td colspan="11"><div class="subw">
      <div class="c-th"><span class="k">題材</span>${esc(r.theme||'—')}</div>
      <div class="c-cond"><span class="k">成立條件</span><span class="mask">***</span><span class="cond real">${esc(s.condition||'—')}</span></div>
    </div></td></tr>`; }).join('') : '<tr><td colspan="12" class="empty">當日無排序</td></tr>';
  renderPnl(d, rank);

  const card = (x,k) => `<div class="card ${k}">
      <div class="top"><span class="nm">${esc(x.name)}</span>
      <span class="px">${fmt(x.close)||''}</span></div>
      <div class="sub2"><span class="cd">${esc(x.code)}${x.industry?" · "+esc(x.industry):""}</span>${chg(x.chg)}</div>
      <div class="rsn">${esc(x.reason||'')}</div>
      <div class="rng">${[['入選至今',x.ret],['5日',x.r5],['10日',x.r10],['20日',x.r20],['期間最高',x.mx]].map(([k,v])=>`<div><small>${k}</small>${pc(v==null||v===''?null:parseFloat(v))}</div>`).join('')}</div>
      ${chips(x.strategies)}
    </div>`;
  renderAll(d);

  const w = d.watch||[], a = d.avoid||[];
  $('c-watch').textContent = w.length ? `${w.length} 檔` : '';
  $('c-avoid').textContent = a.length ? `${a.length} 檔` : '';
  $('cd-watch').innerHTML = w.length ? w.map(x=>card(x,'w')).join('') : '<div class="empty">無</div>';
  $('cd-avoid').innerHTML = a.length ? a.map(x=>card(x,'a')).join('') : '<div class="empty">無</div>';
}

/* ===== v4：記憶設定（localStorage，讀寫失敗就用預設） ===== */
/* v4.2：欄位／排序預設＝站主存的全站預設（網頁預設.json）；任何人都可臨時調整，但不記憶 */
const SITE_DEF = null || {};
const LS = { get(k,d){ const v = SITE_DEF[k]; return v==null ? d : JSON.parse(JSON.stringify(v)); }, set(){} };
try{ Object.keys(localStorage).filter(k=>k.startsWith('hx4_')).forEach(k=>localStorage.removeItem(k)); }catch(e){}
const COLS = [
  {k:'name', t:'個股', g:'', fix:1},
  {k:'ss',   t:'策略', g:'基本'},
  {k:'ind',  t:'產業', g:'基本'},
  {k:'close',t:'收盤', g:'基本', r:1},
  {k:'chg',  t:'當日漲幅', g:'基本', r:1, pct:1},
  {k:'amt',  t:'成交量/額', g:'基本', r:1},
  {k:'cur',  t:'最新價', g:'追蹤', r:1},
  {k:'ret',  t:'入選至今', g:'追蹤', r:1, pct:1},
  {k:'r5',   t:'5日', g:'區間', r:1, pct:1},
  {k:'r10',  t:'10日', g:'區間', r:1, pct:1},
  {k:'r20',  t:'20日', g:'區間', r:1, pct:1},
  {k:'mx',   t:'期間最高', g:'爆發', r:1, pct:1},
];
let MODE = LS.get('mode','ai');
let HIDE = new Set(LS.get('hide', []));
let SORT = LS.get('sort', {k:'ai', dir:1});
let SOFF = new Set(LS.get('soff', []));
const TAGW = {'前8名':0, '':1, '觀察':2, '量小':3};
const TAGC = {'前8名':'t8', '觀察':'tw', '量小':'ta'};
const va = r => (r.amt==null && r.vol==null) ? '<span class="dash">—</span>' :
  `<div class="va"><span class="p">${r.vol!=null?Math.round(r.vol).toLocaleString('en-US'):'—'}</span><span class="p sub">${r.amt==null?'—':(r.amt>=10?Math.round(r.amt):r.amt.toFixed(1))+'億'}</span></div>`;
const pc = v => v==null ? '<span class="dash">—</span>' : `<span class="p ${v>0?'up':(v<0?'dn':'')}">${v>0?'+':''}${v.toFixed(2)}%</span>`;
const nv = v => v==null ? '<span class="dash">—</span>' : `<span class="p">${fmt(v)}</span>`;
const sv = (r,k) => k==='ai' ? r._ai : k==='ss' ? r.ss.length*1000 + (r.amt||0) : k==='name' ? r._ai : k==='ind' ? (r.ind||'') : r[k];

function setMode(m){
  MODE = m; LS.set('mode', m);
  if(!document.body.classList.contains('unlocked')) m = 'all';   // v6.12：沒登入只看每日策略
  $('mv-ai').hidden = m!=='ai'; $('mv-all').hidden = m!=='all';
  document.querySelectorAll('.mode').forEach(b=>b.setAttribute('aria-pressed', b.dataset.m===m?'true':'false'));
}
document.querySelector('.modes').addEventListener('click', e => { const b=e.target.closest('.mode'); if(b) setMode(b.dataset.m); });

function renderAll(d){
  const all = [...(d.rank||[]).map((r,i)=>({r,tag:'前8名',rk:i+1})), ...(d.rest||[]).map(r=>({r,tag:''})), ...(d.watch||[]).map(r=>({r,tag:'觀察'})), ...(d.avoid||[]).map(r=>({r,tag:'量小'}))].map((o,i)=>({code:o.r.code, name:o.r.name, ind:o.r.industry, ss:o.r.strategies||[], close:o.r.close, chg:o.r.chg, amt:o.r.amt, vol:o.r.vol, cur:o.r.cur, ret:(o.r.ret==null||o.r.ret==='')?null:parseFloat(o.r.ret), r5:o.r.r5, r10:o.r.r10, r20:o.r.r20, mx:o.r.mx, tag:o.tag, rk:o.rk, _ai:i}));
  const cs = d.counts||{};
  $('sfilter').innerHTML = '<span class="k">策略</span>' + Object.keys(cs).sort((x,y)=>x-y).map(k =>
    `<button type="button" class="sf ${S[k]||''}" data-s="${k}" aria-pressed="${SOFF.has(k)?'false':'true'}"><span class="s">${esc(k)}</span><span class="n">${cs[k]}</span><span>檔</span></button>`).join('')
    + '<button type="button" class="lnk" data-s="*">全選</button>';
  $('cfilter').innerHTML = '<span class="k">顯示欄位</span>' + COLS.filter(c=>!c.fix).map(c =>

/* v6.36：加密內容先 gzip 壓縮；瀏覽器用 DecompressionStream 解開（太舊的瀏覽器改用 pako） */
async function unz(buf, z){
  if(!z) return new TextDecoder().decode(buf);
  if('DecompressionStream' in window) return await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  if(!window.pako) await new Promise((ok, ng) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js'; sc.onload = ok; sc.onerror = ng; document.head.appendChild(sc); });
  return pako.ungzip(new Uint8Array(buf), {to:'string'});
}
async function openVault(pw, V){

  const derive = salt => crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(salt), iterations:V.iter, hash:'SHA-256'},
    key0, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const dec = (key, iv, ct) => crypto.subtle.decrypt({name:'AES-GCM', iv:b64(iv)}, key, b64(ct));
  if(V.v===2){   // v4.5：多使用者
    // v6.43：先試這台裝置上次成功的那一組（只算一次密碼）；不對再同時試其他組
    const tryU = async u => JSON.parse(new TextDecoder().decode(await dec(await derive(u.salt), u.iv, u.ct)));
    let hint = -1; try{ hint = +localStorage.getItem('hx_u_'+V.users.length) ; }catch(e){}
    let w = null;
    if(hint >= 0 && V.users[hint]) w = await tryU(V.users[hint]).catch(() => null);
    if(!w) w = await Promise.any(V.users.map((u, k) => tryU(u).then(r => { try{ localStorage.setItem('hx_u_'+V.users.length, k); }catch(e){} return r; }))).catch(() => null);
    if(!w) throw new Error('密碼錯誤');
    const dk = await crypto.subtle.importKey('raw', b64(w.k), 'AES-GCM', false, ['decrypt']);
    const o = JSON.parse(await unz(await dec(dk, V.iv, V.ct), V.z));
    o.role = w.role; o._dk = dk; o._w = w; return o;   // v6.30：留著金鑰，解開之後才下載的部分（data/v*.json）
  }
  const pt = await dec(await derive(V.salt), V.iv, V.ct);
  const o = JSON.parse(new TextDecoder().decode(pt)); o.role = 'owner'; return o;
}

    const txr = D.tx[si] && D.tx[ei] ? (D.tx[ei] / D.tx[si] - 1) * 100 : null;
    let h = `<p class="note">期間 ${days[si].slice(0,4)}/${md(days[si])} ~ ${days[ei].slice(0,4)}/${md(days[ei])}（${ei - si + 1} 個交易日），同期加權 ${txr == null ? '—' : sg(txr)}</p>`;
    const series = [];
    for(const key of keys){
      if(key === 'ba' && D.baStart && days[ei] < D.baStart){ h += `<div class="rcrow">ㄟㄞ八法</div><p class="note">ㄟㄞ八法資料從 ${D.baStart.slice(0,4)}/${md(D.baStart)} 才有，請把迄日選在這之後。</p>`; continue; }
      const r = sim(key, si, ei, cap, pct, maxn);
      series.push({name: NAME[key], cls: CLS[key], v: r.curve.map(x => (x / cap - 1) * 100)});
      h += `<div class="rcrow">${NAME[key]}</div><div class="simkpi">` + [
        ['期末總資產', money(r.eq)], ['累計報酬', sg(r.ret)], ['年化', r.cagr == null ? '—' : sg(r.cagr)], ['最大回檔', `<span class="dn">${r.mdd.toFixed(1)}%</span>`],
        ['已出場', r.n ? `${r.n} 筆・勝率 ${Math.round(100 * r.win / r.n)}%` : '0 筆'], ['期末持股', `${r.pos.length} 檔`], ['滿倉／缺錢跳過', `${r.skipped} 次`]
      ].map(([a, b]) => `<div><div class="k">${a}</div><div class="v">${b}</div></div>`).join('') + '</div>';
      const lg = r.log.slice().reverse().slice(0, 300);
      h += `<details><summary class="note">交易明細（共 ${r.log.length} 筆，顯示最新 ${lg.length} 筆）</summary><div class="tbx simlog"><table class="rt"><thead><tr><th>日期</th><th>動作</th><th>個股</th><th>股數</th><th>價格</th><th>金額</th><th>損益</th></tr></thead><tbody>` +
        lg.map(x => `<tr><td>${days[0] <= x.d ? x.d.slice(2,4) + '/' + md(x.d) : ''}</td><td class="${x.a === '買' ? 'up' : 'dn'}">${x.a}</td><td class="tx">${esc(x.n)} <span class="n" style="display:inline">${x.c}</span></td><td>${x.sh.toLocaleString('en-US')}</td><td>${x.px.toFixed(2)}</td><td>${money(x.amt)}</td><td>${x.pnl == null ? '—' : `<span class="${x.pnl>=0?'up':'dn'}">${x.pnl>=0?'+':''}${money(x.pnl)}</span><span class="bx">${x.pct>=0?'+':''}${x.pct.toFixed(1)}%</span>`}</td></tr>`).join('') +
        '</tbody></table></div></details>';
    }
    if(series.length) h = h.replace('<div class="rcrow">', chart(series, si, ei) + '<div class="rcrow">');
    $('rc-out').innerHTML = h;

function apply(docs){
  DAYS = docs.filter(Boolean).sort((a,b)=> String(b.date).localeCompare(String(a.date)));
  if(!DAYS.length){
    $('d-txt').textContent='—'; ['d-prev','d-next','d-latest'].forEach(k=>$(k).disabled=true);
    $('tb-rank').innerHTML = '<tr><td colspan="12" class="empty">還沒有任何一天的紀錄</td></tr>';
    return;
  }
  if(!cur || !DAYS.some(d=>d.date===cur)) cur = DAYS[0].date;
  renderRail(); renderDay(DAYS.find(d=>d.date===cur));
}
