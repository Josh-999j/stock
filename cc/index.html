<!doctype html>
<html lang="zh-Hant">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>try{var th=localStorage.getItem("cc.theme");if(th==="light"||th==="dark")document.documentElement.setAttribute("data-theme",th);}catch(e){}</script>
<link rel="icon" type="image/png" sizes="64x64" href="assets/web/favicon_64.png"><link rel="apple-touch-icon" href="assets/web/favicon_256.png">
<title>AI Project Control Center</title>
<style>
  /* Phase 1：純方塊版面，美化（工廠素材）之後再換 */
  :root {
    --bg: #f3f5f8; --card: #fff; --line: #d9dee6; --text: #1f2933; --muted: #6b7785;
    --FAILED: #d03b3b; --BLOCKED: #e07b1a; --STALE: #c9a000; --RUNNING: #1f9d3a; --WAITING: #2f6fd6; --IDLE: #8a94a0;
    --red: #d03b3b; --orange: #e07b1a; --yellow: #c9a000; --blue: #2f6fd6;
    --veil1: rgba(255,255,255,.72); --veil2: rgba(255,255,255,.82); --on: #fff;
  }
  /* 深色主題（Josh 10/09：可切換 自動／亮／暗；自動＝跟手機或電腦的設定） */
  :root[data-theme="dark"] { --bg: #14171c; --card: #1d2128; --line: #323a45; --text: #e6e9ee; --muted: #9aa4b1; --veil1: rgba(20,23,28,.80); --veil2: rgba(20,23,28,.88); --on: #14171c; color-scheme: dark; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #14171c; --card: #1d2128; --line: #323a45; --text: #e6e9ee; --muted: #9aa4b1; --veil1: rgba(20,23,28,.80); --veil2: rgba(20,23,28,.88); --on: #14171c; color-scheme: dark; } }
  :root[data-theme="light"] { color-scheme: light; }
  /* 頻道表（Josh 10/13：要簡單）*/
  .chan .cchips { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 10px; }
  .chan .cchips button { border: 0; background: transparent; color: var(--muted); border-radius: 999px; padding: 3px 10px; font-size: 13px; }
  .chan .cchips button i { font-style: normal; margin-left: 3px; opacity: .7; }
  .chan .cchips button.on { background: var(--text); color: var(--bg); }
  .chan .clist { max-width: 720px; }
  .chan .cgrp { font-size: 12px; color: var(--muted); padding: 12px 0 4px; }
  .chan .clink { border: 0; background: none; color: var(--blue); font-size: 12px; padding: 0 4px; }
  .chan .crow { display: flex; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); min-width: 0; }
  .chan .ct { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; }
  .chan .cm { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .chan .cr { display: flex; gap: 8px; align-items: center; flex: none; font-size: 12px; color: var(--muted); }
  .chan .csol { color: var(--orange); }
  .chan .cdot { width: 7px; height: 7px; border-radius: 50%; background: var(--RUNNING); }
  @media (max-width: 480px) { .chan .crow { flex-wrap: wrap; row-gap: 0; } .chan .cm { order: 9; flex-basis: 100%; padding-left: 26px; } }
  #themebtn { font-size: 12px; padding: 2px 10px; border-radius: 12px; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 6px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; }
  header .meta { margin-left: auto; color: var(--muted); font-size: 12px; text-align: right; }
  main { padding: 8px 16px 24px; display: grid; gap: 8px; }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; min-width: 0; }
  .box h2 { font-size: 14px; margin: 0 0 8px; display: flex; gap: 6px; align-items: baseline; }
  .box h2 small { color: var(--muted); font-weight: normal; }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); padding: 6px 0; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
  /* KPI 方塊：每塊一個代表色（--ac），左邊色條＋淡色底＋圓形小圖示 */
  .kpi { cursor: pointer; padding: 8px 12px 9px 14px; border-left: 4px solid var(--ac); border-radius: 8px;
         background: linear-gradient(135deg, color-mix(in srgb, var(--ac) 10%, var(--card)), var(--card) 65%);
         transition: transform .15s, box-shadow .15s; min-width: 0; }
  .kpi:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.08); }
  .kpi .top { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .kpi .ic { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
             background: color-mix(in srgb, var(--ac) 18%, var(--card)); color: var(--ac); font-size: 12px; font-weight: bold; }
  .kpi .zh { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .kpi .en { font-size: 10px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi .val { font-size: 28px; font-weight: 700; line-height: 1.15; margin-top: 4px; white-space: nowrap; }
  .kpi .val.hot { color: var(--ac); }
  .kpi .sub { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 右邊的工作小人（表情跟著狀態：開心／喝咖啡／驚嚇／打瞌睡／苦惱） */
  .kpi { display: flex; align-items: center; gap: 8px; }
  .kpi .body { flex: 1; min-width: 0; }
  .kpi .worker { flex: none; width: 58px; height: 58px; border-radius: 50%; object-fit: cover;
                 border: 2px solid color-mix(in srgb, var(--ac) 45%, var(--card)); background: var(--card);
                 box-shadow: 0 2px 6px rgba(0,0,0,.08); }
  @media (max-width: 700px) { .kpi .worker { width: 44px; height: 44px; } .kpi .en { display: none; } }

  .toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
  .toolbar input, .toolbar select, button { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--card); }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .5; }
  .toolbar .pager { margin-left: auto; display: flex; gap: 4px; align-items: center; }
  .pager button.on { background: var(--text); color: var(--on); }

  .machines { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  @media (max-width: 1100px) { .machines { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 700px)  { .machines { grid-template-columns: minmax(0, 1fr); } }
  /* 手機：標題一行、只留中文，時間和資料更新排在標題下面一行 */
  @media (max-width: 700px) {
    header { flex-wrap: wrap; row-gap: 2px; padding: 8px 12px; }
    header h1 { font-size: 18px; white-space: nowrap; }
    header .phase { display: none; }
    header .meta { margin-left: 0; width: 100%; text-align: left; display: flex; flex-wrap: wrap; column-gap: 10px; font-size: 12px; }
  }
  .machine { border: 1px solid var(--line); border-top: 4px solid var(--st); border-radius: 6px; padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; cursor: pointer; background: var(--card); }
  .machine:hover { box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .machine .name { font-weight: bold; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .machine dl { display: grid; grid-template-columns: auto 1fr; gap: 0 8px; margin: 0; font-size: 11.5px; line-height: 1.4; }
  .machine dt { color: var(--muted); }
  .machine dd { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .machine .plain { font-size: 11px; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.35; }
  .view-factory .machine .plain { text-align: center; }
  .machine .reason { font-size: 11.5px; color: var(--st); min-height: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .machine.paused { opacity: .55; background: var(--bg); }
  .modebtns { display: inline-flex; gap: 6px; margin-left: 12px; }
  .modebtns button { font-size: 13px; }
  /* 手機遠端面板 */
  .remote .rentry { padding: 8px 10px; border-radius: 6px; margin-bottom: 6px; font-size: 13.5px; }
  .remote .rentry.ok { background: color-mix(in srgb, var(--RUNNING) 10%, var(--card)); }
  .remote .rentry.bad { background: color-mix(in srgb, var(--FAILED) 12%, var(--card)); }
  .remote .rsum { font-size: 13px; margin: 4px 0 8px; color: var(--muted); }
  .remote .rsum b { color: var(--text); font-size: 15px; }
  .remote .rgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px; }
  .remote .rchip { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 6px; min-width: 0; }
  .remote .ri { font-size: 18px; flex: none; }
  .remote .rt { display: flex; flex-direction: column; min-width: 0; }
  .remote .rt b { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .remote .rt small { font-size: 11px; color: var(--muted); }
  /* 網路版（手機）只看：藏起會改東西的按鈕 */
  body.web button.star, body.web .modebtns, body.web textarea.note, body.web .noteh { display: none; }
  #gate { position: fixed; inset: 0; z-index: 99; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 16px; }
  #gate form { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 20px; width: 100%; max-width: 340px; display: grid; gap: 10px; }
  #gate h2 { margin: 0; font-size: 18px; }
  #gate input[type=password] { font: inherit; font-size: 16px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; }
  #gate button { font-size: 16px; padding: 8px; background: var(--text); color: var(--on); border: 0; border-radius: 4px; }
  textarea.note { width: 100%; font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; resize: vertical; margin-bottom: 10px; }
  /* 美術素材（有圖才會出現） */
  .factory { position: relative; overflow: hidden; }
  .factory[style*="--bg"]::before { content: ""; position: absolute; inset: 0; background: linear-gradient(var(--veil1), var(--veil2)), var(--bg) center / cover no-repeat; z-index: 0; }
  .factory > * { position: relative; z-index: 1; }
  .factory .machine { background: color-mix(in srgb, var(--card) 92%, transparent); }
  .viewsw { margin-left: auto; display: inline-flex; gap: 0; }
  .viewsw button { font-size: 12px; padding: 1px 8px; border-radius: 0; white-space: nowrap; }
  .factory > h2 { flex-wrap: wrap; row-gap: 4px; }
  .viewsw button:first-child { border-radius: 4px 0 0 4px; } .viewsw button:last-child { border-radius: 0 4px 4px 0; border-left: 0; }
  .viewsw button.on { background: var(--text); color: var(--on); }
  .art { position: relative; aspect-ratio: 5 / 4; flex: none; }
  .art img.mc { width: 100%; height: 100%; object-fit: contain; display: block; }
  .art img.ic { position: absolute; transform: translate(-50%, -50%); aspect-ratio: 1; object-fit: contain; filter: drop-shadow(0 0 2px rgba(0,0,0,.35)); }
  .art.gray { filter: grayscale(1); }
  .hero { display: flex; gap: 6px; align-items: center; min-width: 0; }
  .hero-txt { min-width: 0; flex: 1; }
  .view-compact .art { width: 42%; max-width: 110px; }
  .view-compact .hero-txt .reason { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .view-factory .hero { flex-direction: column; align-items: stretch; }
  .view-factory .art { width: 100%; }
  .view-factory .hero-txt .name { font-size: 16px; text-align: center; }
  .view-factory .hero-txt .reason { text-align: center; }
  .machine .cardhead { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
  .machine .cardhead > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  button.star { flex: none; border: 0; background: none; padding: 0 2px; font-size: 18px; line-height: 1; color: #c3c9d2; }
  button.star.on { color: #f2b01e; }
  button.star:hover { color: #f2b01e; }
  .head button.star { font-size: 22px; }
  .machine.slot { border-style: dashed; border-top: 1px dashed var(--line); color: var(--muted); align-items: center; justify-content: center; cursor: default; min-height: 120px; }
  .badge { display: inline-block; padding: 0 6px; border-radius: 10px; font-size: 11px; font-weight: bold; color: #fff; background: var(--st); }
  .tag { display: inline-block; padding: 0 4px; border-radius: 3px; font-size: 10.5px; border: 1px solid var(--line); color: var(--muted); margin-left: 4px; }
  .tag-info { color: var(--WAITING); border-color: var(--WAITING); }
  .model { display: inline-block; padding: 0 5px; margin-left: 4px; border-radius: 3px; font-size: 10.5px; font-weight: bold; color: #fff; }
  .m-duo { background: linear-gradient(90deg, #d97757 50%, #222 50%); }
  .m-code { background: #d97757; } .m-claude { background: #c9a27e; } .m-codex { background: #222; }
  .m-gpt { background: var(--text); } .m-none { background: #aaa; }
  .tag-warn { color: var(--BLOCKED); border-color: var(--BLOCKED); }
  .ok { color: var(--RUNNING); } .bad { color: var(--FAILED); } .warn { color: var(--BLOCKED); }

  .panels { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 1100px) { .panels { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 700px)  { .panels { grid-template-columns: minmax(0, 1fr); } }
  .list { list-style: none; margin: 0; padding: 0; max-height: 320px; overflow: auto; }
  .list li { padding: 5px 0; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: baseline; cursor: pointer; }
  .list li:last-child { border-bottom: 0; }
  .list.full { max-height: none; }
  .list .t { color: var(--muted); font-size: 12px; white-space: nowrap; min-width: 42px; }
  .list .body { flex: 1; min-width: 0; }
  .list .body .p { font-weight: bold; }
  .list .body .x { font-size: 12px; color: var(--muted); word-break: break-word; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: var(--c, var(--IDLE)); flex: none; transform: translateY(1px); }
  .section-title { font-size: 12px; color: var(--muted); margin: 8px 0 2px; }

  .l3 { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; opacity: .6; }
  .l3 input { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; }

  /* 細節 */
  #detail { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; padding: 24px; overflow: auto; z-index: 10; }
  #detail.on { display: block; }
  #detail .sheet { max-width: 1100px; margin: 0 auto; background: var(--bg); border-radius: 8px; padding: 14px; display: grid; gap: 12px; }
  #detail .head { display: flex; gap: 10px; align-items: center; }
  #detail .head h2 { margin: 0; font-size: 20px; }
  #detail .head .close { margin-left: auto; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 800px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; word-break: break-word; }
  th { color: var(--muted); font-weight: normal; white-space: nowrap; }
  .kv th { width: 90px; }
  .log { border-bottom: 1px solid var(--line); padding: 6px 0; }
  .log .h { font-size: 12px; color: var(--muted); }
  .log div { white-space: pre-wrap; word-break: break-word; }
  code { background: var(--line); padding: 0 4px; border-radius: 3px; font-size: 12px; word-break: break-all; }
  a { color: var(--WAITING); }
  .nodata { max-width: 640px; margin: 60px auto; }
  /* 6 頁選單（Josh 10/09）：電腦在標題下方一排；手機固定在畫面最下方，大拇指點 */
  nav#tabs { display: flex; gap: 2px; padding: 0 12px; background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; overflow-x: auto; }
  nav#tabs button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 8px 14px 6px; font-size: 14px; white-space: nowrap; position: relative; color: var(--muted); cursor: pointer; }
  nav#tabs button.on { color: var(--text); border-bottom-color: var(--WAITING); font-weight: bold; }
  nav#tabs .ic { margin-right: 4px; }
  nav#tabs .n { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--FAILED); color: #fff; font-size: 11px; line-height: 18px; margin-left: 4px; text-align: center; font-weight: bold; }
  nav#tabs .n.warn { background: var(--BLOCKED); }
  .pg { display: none; } .pg.on { display: grid; gap: 8px; }
  .clash { border-left: 4px solid var(--BLOCKED); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
  .chip { font-size: 11.5px; padding: 0 6px; border: 1px solid var(--line); border-radius: 10px; white-space: nowrap; }
  .chip.codex { border-color: var(--text); color: var(--text); }
  .who { display: inline-block; font-size: 11px; font-weight: bold; padding: 0 6px; border-radius: 9px; border: 1px solid currentColor; margin-right: 2px; white-space: nowrap; }
  .who-claude { color: #D97757; } .who-codex { color: var(--text); }
  .chip.off { opacity: .5; text-decoration: line-through; }
  table.tools { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.tools th, table.tools td { border-bottom: 1px solid var(--line); padding: 5px 6px; text-align: left; vertical-align: top; }
  table.tools th { color: var(--muted); font-weight: normal; white-space: nowrap; }
  @media (max-width: 700px) {
    nav#tabs { position: fixed; top: auto; bottom: 0; left: 0; right: 0; padding: 0 0 env(safe-area-inset-bottom); border-top: 1px solid var(--line); border-bottom: 0; justify-content: space-around; box-shadow: 0 -2px 8px rgba(0,0,0,.08); }
    nav#tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 5px 0 4px; font-size: 11px; border-bottom: 0; border-top: 3px solid transparent; }
    nav#tabs button.on { border-top-color: var(--WAITING); }
    nav#tabs .ic { font-size: 20px; line-height: 1.15; margin: 0; }
    nav#tabs .n { position: absolute; top: 1px; left: calc(50% + 6px); margin: 0; }
    body { padding-bottom: 66px; }
    table.tools thead { display: none; } table.tools td { display: block; border: 0; padding: 1px 0; } table.tools tr { display: block; border-bottom: 1px solid var(--line); padding: 6px 0; }
  }
  #onboard .obgrid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,420px); gap: 16px; }
  @media (max-width:700px) { #onboard { margin: 12px 8px !important; } #onboard .obgrid { grid-template-columns: 1fr; } }
.office .officeinfo{font-size:14px;margin-top:8px;line-height:1.6;min-height:1.6em}
.bigc-head{font-size:15px;margin:4px 0 8px}.bigc-cur{border:1px solid var(--line);border-radius:10px;padding:8px 10px;line-height:1.6}
</style>
</head>
<body>
<header>
  <img id="logo" alt="" style="display:none;height:28px">
  <h1>AI Project Control Center</h1>
  <button id="obbtn" onclick="openOnboard()" title="跳到「新專案使用規定」：複製開場句" style="font-size:13px;padding:2px 10px;border-radius:12px">➕ 開新專案</button>
  <button id="themebtn" onclick="cycleTheme()" title="切換顏色：自動（跟手機／電腦）→ 亮 → 暗">🌓 自動</button>
  <span id="hdrusage" style="display:flex;gap:14px;align-items:center;font-size:13px"></span>
  <div class="meta"><div id="clock"></div><div id="gen"></div></div>
</header>
<nav id="tabs"></nav>
<main id="app"></main>
<section id="onboard" class="box" style="margin:12px 16px"></section>
<div id="detail" onclick="if(event.target===this)closeDetail()"><div class="sheet" id="sheet"></div></div>

<script>window.CC_WEB = 1;</script>
<script>
const WEB = !!window.CC_WEB;  // 網路版：只看，不顯示停機／最愛／備註等按鈕
if (WEB) document.body.classList.add("web");
// 本機控制中心（local_server.py，127.0.0.1:8770）才顯示「控制頁」入口；手機網頁、直接開檔都不顯示
const LOCAL_CTRL = !WEB && location.port === "8770";
// 三種開法用不同分頁名稱，存「我的最愛」才分得出來（Josh 10/09：本機存最愛蓋掉網路版）
document.title = WEB ? "控制中心（手機網頁）" : LOCAL_CTRL ? "控制中心（本機）" : "控制中心（檔案）";
if (LOCAL_CTRL) document.addEventListener("DOMContentLoaded", () => {
  const h = document.querySelector("header h1");
  if (h) h.insertAdjacentHTML("afterend", '<a href="/control.html" style="margin-left:8px;font-size:13px;padding:2px 10px;border:1px solid var(--line);border-radius:12px;text-decoration:none">🔒 控制頁</a>');
});
const STATUS =["FAILED","BLOCKED","STALE","RUNNING","WAITING","IDLE"];
const TAGS = ["大C小C", "分散", "多平台"];
const TAG_TIP = {"大C小C": "Claude 與 Codex 合作的專案", "分散": "同一個專案有不只一份資料夾", "多平台": "Codex 和 Claude 都有手動對話"};
const tagHtml = m => (m.tags || []).map(t => `<span class="tag tag-${t === "分散" ? "warn" : "info"}" title="${esc(TAG_TIP[t] || "")}">${esc(t)}</span>`).join("");
const ZH = {FAILED:"失敗",BLOCKED:"卡住",STALE:"停滯",RUNNING:"運行中",WAITING:"等待中",IDLE:"休眠"};
const RES = {success:["成功","ok"],failed:["失敗","bad"],running:["執行中","ok"],pending:["待執行","muted"],missed:["未執行","warn"],skipped:["已停用","muted"],todo:["今日","warn"],overdue:["逾期","bad"]};
const SORTS = {
  severity: ["依嚴重度（失敗→休眠）", null],
  recent:   ["最近更新在前", (a, b) => (b.last_activity || "").localeCompare(a.last_activity || "")],
  oldest:   ["最久沒動在前", (a, b) => (a.last_log || "0").localeCompare(b.last_log || "0")],
  name:     ["名稱（英文字母／中文筆畫）", (a, b) => a.name.localeCompare(b.name, "zh-Hant")],
  next:     ["下次執行最近", (a, b) => (a.next_run || "9999").localeCompare(b.next_run || "9999")],
  success:  ["7日成功率低在前", (a, b) => rate(a) - rate(b)],
};
const rate = m => m.runs_7d ? m.success_7d / m.runs_7d : 2;
const store = { get(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const ui = { tab: "home",   // Josh 10/14：一打開都先到總覽（不記上次的分頁）
 page: 1, q: "", filter: "ALL", sort: store.get("cc.sort", "severity"), view: store.get("cc.view", "compact") };
const MODEL_ZH = {"Claude+Codex": "Claude+Codex（大小C）", Code: "Code（Claude Code）", Codex: "Codex", Claude: "Claude（聊天）", ChatGPT: "ChatGPT"};
const modelCls = x => ({"Claude+Codex": "duo", Code: "code", Codex: "codex", Claude: "claude", ChatGPT: "gpt"}[x] || "none");
const modelChip = m => m.model ? `<span class="model m-${modelCls(m.model)}" title="型號：${esc(MODEL_ZH[m.model] || m.model)}">${esc(m.model)}</span>` : "";
const opText = m => { const o = m.operator; if (!o) return ""; return `${esc(MODEL_ZH[o.who] || o.who)}・${esc(o.what)}${o.t ? " " + ago(o.t) : ""}`; };
const autoText = m => { const a = m.automations || []; if (!a.length) return ""; const on = a.filter(x => x.on).length; return `${on} 個開著${a.length - on ? `・${a.length - on} 個停用` : ""}`; };
const KIND_ZH = {stock: "股票", data: "資料", web: "網頁", spider: "爬蟲", tool: "工具", ai: "大C小C", study: "學習", general: "通用"};
const A = () => (S && S.assets) || {machines: [], icons: []};
const aurl = p => `assets/web/${p}?v=${A().ver || 0}`;
// 機台圖：該狀態沒圖就退回其他狀態的圖；完全沒有素材就回傳空字串（網頁維持方塊樣式）
function machineArt(m, paused) {
  const ms = A().machines || [];
  if (!ms.length) return "";
  const st = paused ? "IDLE" : m.status;
  const pick = [st, "IDLE", "WAITING", "RUNNING", ms[0]].find(x => ms.includes(x));
  const L = Object.assign({cx: 0.52, cy: 0.43, size: 0.2}, (A().layout || {}).screen || {});
  const kind = (A().icons || []).includes(m.kind) ? m.kind : ((A().icons || []).includes("general") ? "general" : "");
  const icon = kind ? `<img class="ic" loading="lazy" src="${aurl("icons/" + kind + ".png")}" alt="" style="left:${L.cx*100}%;top:${L.cy*100}%;width:${L.size*100}%">` : "";
  return `<div class="art${paused ? " gray" : ""}" title="${esc(ZH[m.status] || "")}・${esc(KIND_ZH[m.kind] || "")}"><img class="mc" loading="lazy" src="${aurl("machines/" + pick + ".png")}" alt="${esc(m.status)}">${icon}</div>`;
}
function setView(v) { ui.view = v; ui.page = 1; store.set("cc.view", v); render(); }
if (!SORTS[ui.sort]) ui.sort = "severity";
let S = null;

// 機台開關：只存在這台電腦的瀏覽器，不改專案檔、不停排程
//   maint＝停機保養：變灰、排最後、不列入提醒與 KPI
//   off  ＝關機：從 Factory Tool 隱藏（篩選「已關機」可找回）
let MODE = {};
try { MODE = JSON.parse(store.get("cc.mode", "{}")) || {}; } catch (e) {}
try { for (const id of JSON.parse(store.get("cc.paused", "[]"))) MODE[id] = MODE[id] || "maint"; } catch (e) {}  // 舊「暫停」轉成停機保養
const modeOf = id => MODE[id] || "";
const isPaused = id => !!MODE[id];          // 保養或關機：都不列入提醒與 KPI
const isOff = id => MODE[id] === "off";
const live = arr => arr.filter(x => !isPaused(x.pid));
// 保養／關機備註：{id: {text, time}}，一樣只存在這台電腦的瀏覽器
let NOTE = {};
try { NOTE = JSON.parse(store.get("cc.modenote", "{}")) || {}; } catch (e) {}
const noteOf = id => (NOTE[id] && NOTE[id].text) || "";
function saveNote(id, text) {
  if (text) NOTE[id] = {text, time: new Date().toLocaleString("sv").slice(0, 16)}; else delete NOTE[id];
  store.set("cc.modenote", JSON.stringify(NOTE));
}
// 我的最愛：[id, ...]，只存在這台電腦的瀏覽器
let FAV = [];
try { FAV = JSON.parse(store.get("cc.fav", "[]")) || []; } catch (e) {}
const isFav = id => FAV.includes(id);
function toggleFav(id, ev) {
  if (ev) ev.stopPropagation();  // 點星星不要打開詳細頁
  FAV = isFav(id) ? FAV.filter(x => x !== id) : [...FAV, id];
  store.set("cc.fav", JSON.stringify(FAV));
  render();
  if (ui.detail) openDetail(ui.detail);
}
const starBtn = m => `<button class="star${isFav(m.id) ? " on" : ""}" title="${isFav(m.id) ? "取消最愛" : "加入最愛（排到最前面）"}" onclick="toggleFav('${esc(m.id)}', event)">${isFav(m.id) ? "★" : "☆"}</button>`;
function setMode(id, mode) {
  if (mode) MODE[id] = mode; else delete MODE[id];
  store.set("cc.mode", JSON.stringify(MODE));
  try { localStorage.removeItem("cc.paused"); } catch (e) {}
  render();
  if (ui.detail) openDetail(ui.detail);
}
const MODE_BADGE = {maint: '<span class="badge" style="--st:var(--IDLE)">🔧 停機保養</span>', off: '<span class="badge" style="--st:#555">⏻ 已關機</span>'};
const modeBtns = m => {
  const md = modeOf(m.id), id = esc(m.id);
  return md ? `<button onclick="setMode('${id}', '')">▶ 恢復運轉</button>`
    : `<button onclick="setMode('${id}', 'maint')" title="暫時不管：變灰、排到最後、不列入提醒（不會停掉排程）">🔧 停機保養</button>
       <button onclick="setMode('${id}', 'off')" title="從機台區隱藏；篩選「已關機」可以找回（不會停掉排程、不刪檔案）">⏻ 關機</button>`;
};

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const stVar = st => `--st:var(--${st})`;
const badge = st => `<span class="badge" style="${stVar(st)}">${st} ${ZH[st]||""}</span>`;
const res = r => { const x = RES[r]; return x ? `<span class="${x[1]}">${x[0]}</span>` : esc(r||"—"); };
function ago(ts) {
  if (!ts) return "—";
  const d = (Date.now() - new Date(ts.replace(" ", "T")).getTime()) / 60000;
  if (d < 1) return "剛剛";
  if (d < 60) return Math.round(d) + " 分鐘前";
  if (d < 1440) return Math.round(d / 60) + " 小時前";
  return Math.floor(d / 1440) + " 天前";
}
function until(ts) {
  if (!ts) return "未排程";
  const t = new Date(ts.replace(" ", "T")), n = new Date();
  const day = (new Date(t.toDateString()) - new Date(n.toDateString())) / 864e5;
  const hm = ts.slice(11, 16);
  return day === 0 ? "今天 " + hm : day === 1 ? "明天 " + hm : ts.slice(5, 16);
}
const byId = id => S.machines.find(m => m.id === id);

function filtered() {
  const q = ui.q.trim().toLowerCase();
  const cmp = SORTS[ui.sort][1];
  const sorted = cmp ? [...S.machines].sort(cmp) : [...S.machines];
  // 我的最愛排最前面，保養／關機的永遠排最後
  const list = [...sorted.filter(m => !isPaused(m.id) && isFav(m.id)), ...sorted.filter(m => !isPaused(m.id) && !isFav(m.id)), ...sorted.filter(m => isPaused(m.id))];
  return list.filter(m => {
    if (ui.filter === "MAINT" || ui.filter === "OFF") { if (modeOf(m.id) !== ui.filter.toLowerCase()) return false; }
    else if (isOff(m.id)) return false;  // 關機的只在「已關機」篩選裡出現
    else if (ui.filter.startsWith("MODEL:")) { if (m.model !== ui.filter.slice(6)) return false; }
    else if (ui.filter.startsWith("TAG:")) { if (!(m.tags || []).includes(ui.filter.slice(4))) return false; }
    else if (ui.filter !== "ALL" && (m.status !== ui.filter || isPaused(m.id))) return false;
    if (!q) return true;
    const hay = [m.name, m.id, m.purpose, m.folder, m.git, m.next_step, m.owner,
      ...(m.chats||[]).map(c => typeof c === "string" ? c : [c.source, c.title, c.url].join(" ")),
      ...(m.failures||[]).map(f => f.error), ...(m.worklog||[]).map(w => [w.done, w.blocked, w.next, w.source].join(" "))
    ].join(" ").toLowerCase();
    return hay.includes(q);
  });
}

function mainChat(m) {
  const c = m.footprint && m.footprint.main_chat;
  return c ? `${c.platform}｜${c.title}` : "";
}

function footprintBox(m) {
  const f = m.footprint;
  if (!f) return "";
  const plats = Object.entries(f.platforms || {}).map(([p, v]) =>
    `<li><b>${esc(p)}</b>：${v.count - v.auto} 個對話${v.auto ? `＋${v.auto} 次自動執行` : ""}，最後 ${esc(v.last)}</li>`).join("");
  const chats = (f.chats || []).map(c => `<tr><td>${esc(c.platform)}</td><td>${esc(c.title)}</td><td>${esc((c.last||"").slice(5))}</td></tr>`).join("");
  const others = (f.others || []).map(o => `<li><code>${esc(o.path)}</code> <span class="muted">${esc(o.why)}${o.sessions ? `・${o.sessions} 個對話・最後 ${esc(o.last)}` : ""}${o.exists === false ? "・已不存在" : ""}${o.old_cloud ? "・早期雲端" : ""}</span></li>`).join("");
  const cb = f.collab ? `<p>協作狀態：輪到 <b>${esc(f.collab["輪到"] || "—")}</b>｜目前任務 ${esc(f.collab["目前任務"] || "—")}｜大C上次檢查 ${esc(f.collab["大C上次檢查"] || "—")}｜小C上次檢查 ${esc(f.collab["小C上次檢查"] || "—")}</p>` : "";
  return `<div class="box"><h2>在哪裡做過 <small>電腦上的對話紀錄</small> ${tagHtml(m)}</h2>
    ${cb}
    <ul>${plats || '<li class="muted">電腦上沒有這個資料夾的對話（可能在網頁版）</li>'}</ul>
    ${chats ? `<table><tr><th>平台</th><th>對話名稱（新→舊，不含自動執行）</th><th>最後</th></tr>${chats}</table>` : ""}
    ${others ? `<h2 style="margin-top:10px">其他位置</h2><ul>${others}</ul>` : ""}
    ${(f.advice || []).length ? `<h2 style="margin-top:10px">整理建議 <small>只是建議</small></h2><ul>${f.advice.map(a => `<li>${esc(a)}</li>`).join("")}</ul>` : ""}
  </div>`;
}

function distributionPanel() {
  const spread = S.machines.filter(m => !isPaused(m.id) && (m.footprint?.advice || []).length);
  const un = S.unregistered || [];
  const active = un.filter(u => u.exists && !u.old_cloud), history = un.filter(u => !u.exists || u.old_cloud);
  const unRow = u => `<li><span class="body"><span class="p">${esc(u.path)}</span>
      <div class="x">${esc(u.platforms.join("、"))} ${u.manual} 個對話${u.sessions > u.manual ? `＋${u.sessions - u.manual} 次自動` : ""}・最後 ${esc(u.last)}${u.collab ? "・大C小C" : ""}</div>
      <div class="x">${esc(u.titles.join("／"))}</div></span></li>`;
  return `<section class="box"><h2>專案分布整理 <small>只看不改</small></h2>
    <div class="panels" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">
      <div><div class="section-title">需要整理的專案（${spread.length}）</div>
        <ul class="list">${spread.map(m => `<li onclick="openDetail('${esc(m.id)}')"><span class="body"><span class="p">${esc(m.name)}</span> ${tagHtml(m)}
          ${m.footprint.advice.map(a => `<div class="x">${esc(a)}</div>`).join("")}</span></li>`).join("") || '<li class="empty">沒有</li>'}</ul></div>
      <div><div class="section-title">有在做、但還沒登錄的資料夾（${active.length}）</div>
        <ul class="list">${active.map(unRow).join("") || '<li class="empty">沒有</li>'}</ul></div>
      <div><div class="section-title">舊位置／早期雲端（歷史，${history.length}）</div>
        <ul class="list">${history.map(unRow).join("") || '<li class="empty">沒有</li>'}</ul></div>
    </div></section>`;
}

function machineCard(m) {
  const sr = m.runs_7d ? Math.round(m.success_7d * 100 / m.runs_7d) + "%" : "—";
  const p = isPaused(m.id);
  return `<div class="machine${p ? " paused" : ""}" style="${stVar(p ? "IDLE" : m.status)}" onclick="openDetail('${esc(m.id)}')">
    <div class="cardhead"><span>${p ? MODE_BADGE[modeOf(m.id)] : badge(m.status)}${modelChip(m)}${m.demo ? '<span class="tag">DEMO</span>' : ""}${tagHtml(m.tags ? Object.assign({}, m, {tags: m.tags.filter(t => t !== "大C小C")}) : m)}${phoneTag(m)}</span>${starBtn(m)}</div>
    ${(() => { const art = machineArt(m, p), nm = `<div class="name" title="${esc(m.name)}">${esc(m.name)}</div>
    ${m.plain ? `<div class="plain" title="${esc(m.plain)}">${esc(m.plain)}</div>` : ""}
    ${(p || m.status === "IDLE") && noteOf(m.id) ? `<div class="reason" title="${esc(noteOf(m.id))}">📝 ${esc(noteOf(m.id))}</div>`
      : `<div class="reason" title="${esc((m.status_reasons||[]).join("；"))}">${esc((m.status_reasons||[])[0] || "")}</div>`}`;
      return art ? `<div class="hero">${art}<div class="hero-txt">${nm}</div></div>` : nm; })()}
    <dl>
      ${opText(m) ? `<dt>執行者</dt><dd title="${opText(m)}">${opText(m)}</dd>` : ""}
      <dt>最後更新</dt><dd>${ago(m.last_activity)}</dd>
      ${m.last_run ? `<dt>最後執行</dt><dd>${res(m.last_result)} · ${ago(m.last_run)}${m.runs_7d ? `（7日 ${sr}）` : ""}</dd>` : ""}
      ${m.next_run ? `<dt>下次執行</dt><dd>${until(m.next_run)}</dd>` : ""}
      <dt>下一步</dt><dd title="${esc(m.next_step)}">${esc(m.next_step || "—")}</dd>
      ${autoText(m) ? `<dt>自動化</dt><dd title="${esc((m.automations||[]).map(a => a.name + (a.on ? "" : "（停用）")).join("、"))}">${autoText(m)}</dd>` : ""}
      ${mainChat(m) ? `<dt>主要對話</dt><dd title="${esc(mainChat(m))}">${esc(mainChat(m))}</dd>` : ""}
      ${m.site ? `<dt>網站</dt><dd><a href="${esc(m.site)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(m.site.replace(/^https?:\/\//, "").replace(/\/$/, ""))}</a></dd>` : ""}
    </dl>
  </div>`;
}

function render() {
  const app = document.getElementById("app");
  if (!S) {
    app.innerHTML = `<div class="box nodata"><h2>還沒有資料</h2>
      <p>找不到 <code>state.js</code>。請先在這個資料夾執行 <code>open_dashboard.bat</code>（或 <code>py -3 collector.py</code>）。</p></div>`;
    return;
  }
  const hasArt = (A().machines || []).length > 0;
  const ps = hasArt && ui.view === "factory" ? 5 : (S.config.page_size || 10);
  // 提醒、排程、失敗、KPI 都排除保養／關機的機台；Activity Feed 只排除關機的
  const today = live(S.today_tasks), rems = live(S.reminders), fails = live(S.failed_jobs), scheds = live(S.schedules);
  const act = S.machines.filter(m => !isPaused(m.id));
  const cnt = Object.fromEntries(STATUS.map(s => [s, act.filter(m => m.status === s).length]));
  const k = Object.assign({}, S.kpi, {projects: act.length, running: cnt.RUNNING, failed: cnt.FAILED,
                                      stale: cnt.STALE, blocked: cnt.BLOCKED, today_tasks: today.length});
  const list = filtered();
  const pages = Math.max(1, Math.ceil(list.length / ps));
  ui.page = Math.min(ui.page, pages);
  const slice = list.slice((ui.page - 1) * ps, ui.page * ps);
  const slots = Array.from({length: ps - slice.length}, () => `<div class="machine slot">空機位</div>`).join("");

  const todayRows = today.map(t => `<li onclick="openDetail('${esc(t.pid)}')">
      <span class="t">${esc(t.time || "下一步")}</span>
      <span class="body"><span class="p">${esc(t.project)}</span> ${esc(t.title)}</span>${res(t.state)}</li>`).join("");
  const remRows = rems.map(r => `<li ${r.pid ? `onclick="openDetail('${esc(r.pid)}')"` : ""}>
      <span class="dot" style="--c:var(--${r.level})"></span>
      <span class="body"><span class="p">${esc(r.project)}</span><div class="x">${esc(r.text)}</div></span></li>`).join("");

  const pg = (id, html) => `<div class="pg${ui.tab === id ? " on" : ""}" data-pg="${id}">${html}</div>`;
  app.innerHTML = 
  pg("home", `
  <section class="kpis">
    ${kpi("Projects 專案", k.projects, `${cnt.IDLE} 休眠・${S.machines.filter(m => modeOf(m.id) === "maint").length} 保養・${S.machines.filter(m => isOff(m.id)).length} 關機`, "ALL", "", "#5b6b82", "▦", "BLOCKED")}
    ${kpi("Running 運行中", k.running, `${cnt.WAITING} 等待中`, "RUNNING", "", "var(--RUNNING)", "▶", "RUNNING")}
    ${kpi("Today's Tasks 今日", k.today_tasks, "排程＋今日下一步", "", "", "var(--WAITING)", "◷", "WAITING")}
    ${kpi("Failed 失敗", k.failed, k.blocked ? "專案卡住" : "", "FAILED", k.failed ? "bad" : "", "var(--FAILED)", "✕", k.failed ? "FAILED" : "RUNNING")}
    ${kpi("Stale 停滯", k.stale, `>${S.config.stale_days} 天沒動`, "STALE", k.stale ? "warn" : "", "var(--STALE)", "❚❚", k.stale ? "STALE" : "RUNNING")}
    ${kpi("Success|7 日成功率", k.success_rate_7d == null ? "—" : k.success_rate_7d + "%", `${k.runs_7d} 次執行`, "", "", "#7a5cc2", "✓", k.runs_7d ? "RUNNING" : "IDLE")}
  </section>

  ${todoPanel()}
  ${relayLine()}
  ${usagePanel()}
  <section class="panels">
    <div class="box"><h2>今日提醒 <small>${today.length} 任務 · ${rems.length} 提醒</small></h2>
      <div class="section-title">今日任務</div>
      <ul class="list">${todayRows || '<li class="empty">今天沒有排定任務</li>'}</ul>
      <div class="section-title">需要注意</div>
      <ul class="list">${remRows || '<li class="empty">一切正常</li>'}</ul></div>

    <div class="box"><h2>Failed Jobs 失敗 <small>${fails.length}</small></h2>
      <ul class="list">${fails.map(f => `<li onclick="openDetail('${esc(f.pid)}')">
        <span class="dot" style="--c:var(--red)"></span>

function ownerMap() {

  ((S.registry || {}).projects || []).forEach(p => {

// 每天固定時間跑的：Windows 排程（每 30 分鐘以內就重跑的常駐型不算）＋小C定時任務
function timeSlots() {
  const om = ownerMap(), out = [];
  ((S.background || {}).tasks || []).forEach(t => {
    if (t.state === "Disabled") return;
    const rp = (t.rep || "").match(/PT(\d+)M/); if (rp && +rp[1] <= 30) return;
    if ((t.rep || "").match(/PT\d+S/)) return;
    (t.at || "").split(",").filter(Boolean).forEach(a => out.push({t: a, project: om.sch[t.name] || t.project || "（沒有主人）", name: t.name, kind: "排程"}));
  });
  (S.codex_autos || []).filter(a => a.on && a.at).forEach(a => out.push({t: a.at, project: om.auto[a.name] || "（沒有主人）", name: a.name, kind: "小C定時"}));
  out.forEach(x => x.min = +x.t.slice(0, 2) * 60 + +x.t.slice(3, 5));
  return out.sort((a, b) => a.min - b.min);
}
// 5 分鐘內有兩個以上「不同專案」在跑＝可能撞（搶 XQ、搶網路、搶 Telegram、前一個還沒做完）
function clashes() {
  const sl = timeSlots(), out = [];
  let i = 0;
  while (i < sl.length) {
    let j = i; while (j + 1 < sl.length && sl[j + 1].min - sl[i].min <= 5) j++;
    const grp = sl.slice(i, j + 1);
    if (new Set(grp.map(x => x.project)).size > 1) out.push(grp);
    i = j + 1;
  }
  return out;
}

// 網路版（手機看）：publish_web.py 會在頁面加 window.CC_WEB=1。
// 資料是 state.enc（AES-256-GCM，PBKDF2-SHA256 60 萬次），在瀏覽器裡用密碼解開；密碼只記在這支手機。
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
// 10/10 加速：①state.enc 用 no-cache（沒變就回 304，不重下載）②資料沒變（iv 一樣）就不解密、不重畫
// ③金鑰（PBKDF2 60 萬次，手機要 1～3 秒）算一次就存起來：記憶體＋IndexedDB；salt 固定，換密碼或換 salt 才重算
let KEYC = null, LASTIV = "";
function idb(mode, fn) {
  return new Promise(res => {
    try {
      const r = indexedDB.open("cc-web", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("k");
      r.onsuccess = () => { try { const t = r.result.transaction("k", mode); const q = fn(t.objectStore("k")); t.oncomplete = () => res(q && q.result); t.onerror = () => res(null); } catch (e) { res(null); } };
      r.onerror = () => res(null);
    } catch (e) { res(null); }
  });

}
